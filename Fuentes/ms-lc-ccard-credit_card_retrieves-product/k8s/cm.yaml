apiVersion: v1
kind: ConfigMap
metadata:
  name: ${ms-name}-cm
  namespace: ${eks-namespace}
data:
  SPRING_APPLICATION_NAME: ${ms-name}
  SPRING_PROFILES_ACTIVE: ${env}
  JAVA_TOOL_OPTIONS: ${java-options}

  # [logging]
  LOG_LEVEL: "INFO"
  LOGGING_FORMAT: ${logging-format}
  LOGGING_MASK_ENABLED: "${logging-mask-enabled}"

  # [AWS]
  AWS_REGION: ${region}

  EXCEPTION_TYPE: ${exception-type}
  # External Services
  ## DWH Service`
#  DWH_BASE_URL: "http://internal-k8s-nsintegr-icingres-ae70579843-395457718.us-east-1.elb.amazonaws.com"
  DWH_BASE_URL: ${ic-wrapper-url-alb-https}
  DWH_WRAPPER_CONNECT_TIMEOUT_MS: ${dwh-wrapper-connect-timeout}
  DWH_WRAPPER_READ_TIMEOUT_MS: ${dwh-wrapper-read-timeout}
  DWH_WRAPPER_RETRY_ATTEMPTS: ${dwh-wrapper-retry}
  DWH_WRAPPER_PATH: ${dwh-wrapper}

  ## ABanks Service
  ABANKS_BASE_URL: ${ic-wrapper-url-alb-https}
  BANKS_PA01: ${abanks-wrapper-pan}
  BANKS_GT01: ${abanks-wrapper-gtm}

  ## Cobis Service
  COBIS_BASE_URL: ${ic-wrapper-url-alb-https}
  COBIS_WRAPPER_PATH: ${cobis-wrapper-ws}
  COBIS_SP_BASE_URL: ${ic-wrapper-url-alb-https}
  COBIS_SP_PATH: ${cobis-sp-wrapper}

  ## T24 Service
  T24_BASE_URL: ${ic-wrapper-url-alb-https}
  T24_URL: ${ic-wrapper-url-alb-https}
  T24_WRAPPER_PATH: ${t24-wrapper-v1}

  ## Error Service
  ERROR_BASE_URL: ${ic-transaction-engine-url-alb-https}
  ERROR_PATH: ${error-wrapper}

  ## CCP Service
  CCP_BASE_URL: ${ccp-base-url}
  CCP_WRAPPER_CONNECT_TIMEOUT_MS: ${ccp-wrapper-connect-timeout-ms}
  CCP_WRAPPER_READ_TIMEOUT_MS: ${ccp-wrapper-read-timeout-ms}
  CCP_WRAPPER_RETRY_ATTEMPTS: ${ccp-wrapper-retry-attempts}
  CCP_WRAPPER_PATH: ${ccp-wrapper-path}

  ## VPS Cache Manager Service
  VPS_CACHE_MANAGER_BASE_URL: ${ic-transaction-engine-url-alb-https}
  VPS_CACHE_MANAGER_PATH: ${cache-vision-plus}
  VPS_CACHE_MANAGER_CONNECT_TIMEOUT_MS: ${vps-cache-manager-connect-timeout-ms}
  VPS_CACHE_MANAGER_READ_TIMEOUT_MS: ${vps-cache-manager-read-timeout-ms}
  VPS_CACHE_MANAGER_RETRY_ATTEMPTS: ${vps-cache-manager-retry-attempts}
  VPS_CACHE_MANAGER_CACHE_TTL: ${vps-cache-manager-cache-ttl}
  VPS_CACHE_MANAGER_SETTLEMENT_QUOTE_INQUIRY_L8V1_OPERATION: ${vps-cache-manager-settlement-quote-inquiry-l8v1-operation}
  VPS_CACHE_MANAGER_SETTLEMENT_QUOTE_INQUIRY_L8V1_PARAM_NAME: ${vps-cache-manager-settlement-quote-inquiry-l8v1-param-name}
  VPS_CACHE_MANAGER_SETTLEMENT_QUOTE_INQUIRY_L8V2_OPERATION: ${vps-cache-manager-settlement-quote-inquiry-l8v2-operation}
  VPS_CACHE_MANAGER_SETTLEMENT_QUOTE_INQUIRY_L8V2_PARAM_NAME: ${vps-cache-manager-settlement-quote-inquiry-l8v2-param-name}

  ## Database Configuration
  DB_CONNECTION_TIMEOUT: ${db-connection-timeout}
  DB_QUERY_TIMEOUT: ${db-query-timeout}

  ## AWS Configuration
  SECRETS_MANAGER_ENDPOINT: ${secrets-manager-endpoint}
  PARAMETER_STORE_ENDPOINT: ${parameter-store-endpoint}
  AWS_LAMBDA_FUNCTION_ARN: ${aws-lambda-function-arn}

  HND_SECM_DB_CONN: ${hnd-secm-db-conn}
  GTM_SECM_DB_CONN: ${gtm-secm-db-conn}
  PAN_SECM_DB_CONN: ${pan-secm-db-conn}
  NIC_SECM_DB_CONN: ${nic-secm-db-conn}
  PROCESS_HN_SECM_DB_CONN: ${process-hn-secm-db-conn}
  CARDS_PROCESS_HN_SECM_DB_CONN: ${cards-process-hn-secm-db-conn}
  PROCESS_GT_SECM_DB_CONN: ${process-gt-secm-db-conn}
  PROCESS_PA_SECM_DB_CONN: ${process-pa-secm-db-conn}
  CARDS_PROCESS_NI_SECM_DB_CONN: ${cards-process-ni-secm-db-conn}
  HND_PARM_DB_CONN: ${hnd-parm-db-conn}
  GTM_PARM_DB_CONN: ${gtm-parm-db-conn}
  PAN_PARM_DB_CONN: ${pan-parm-db-conn}
  NIC_PARM_DB_CONN: ${nic-parm-db-conn}
  PROCESS_HN_PARM_DB_CONN: ${process-hn-parm-db-conn}
  CARDS_PROCESS_HN_PARM_DB_CONN: ${cards-process-hn-parm-db-conn}
  PROCESS_GT_PARM_DB_CONN: ${process-gt-parm-db-conn}
  PROCESS_PA_PARM_DB_CONN: ${process-pa-parm-db-conn}
  CARDS_PROCESS_NI_PARM_DB_CONN: ${cards-process-ni-parm-db-conn}

  #BIAN
  BIAN_BUSINESS_AREA: ${bian-business-area}
  BIAN_BUSINESS_DOMAIN: ${bian-business-domain}
  BIAN_SERVICE_DOMAIN: ${bian-service-domain}
