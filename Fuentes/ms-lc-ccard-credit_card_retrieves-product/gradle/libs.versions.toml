[versions]
validation        = "3.5.6"
springdoc         = "2.8.13"
lombok            = "1.18.34"
jackson           = "2.22"
mapstruct         = "1.5.5.Final"
aws               = "2.35.0"
reactivecommons   = "0.1.0"
caffeine          = "3.2.2"
reactor           = "3.6.12"
jsonXml           = "20250517"
archunit          = "1.4.1"
core              = "2.22.0"
spring-cloud = "2025.0.0"
r2dbc-sqlserver   = "1.0.3.RELEASE"
resilience4j      = "2.2.0"
ficohsa-lib        = "2.4.2-SNAPSHOT"
ficohsa-regionalization = "2.4.2-SNAPSHOT"
ficohsa-logging    = "2.4.2-SNAPSHOT"
netty = "4.1.135.Final"
[libraries]
# [Main]
archunit             = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
projectreactor-netty = { module = "io.netty:netty-codec-http", version.ref = "netty" }
boot-starter         = { module = "org.springframework.boot:spring-boot-starter" }
boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
boot-validation      = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "validation" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
aws-dynamodb = { module = "software.amazon.awssdk:dynamodb", version.ref = "aws" }
aws-dynamodb-enhanced = { module = "software.amazon.awssdk:dynamodb-enhanced", version.ref = "aws" }
reactivecommons-utils = { module = "org.reactivecommons.utils:object-mapper", version.ref = "reactivecommons" }
aws-secretmanager = { module = "software.amazon.awssdk:secretsmanager", version.ref = "aws" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
aws-ssm = { module = "software.amazon.awssdk:ssm", version.ref = "aws" }
aws-sts = { module = "software.amazon.awssdk:sts", version.ref = "aws" }
aws-lambda = { module = "software.amazon.awssdk:lambda", version.ref = "aws" }

# [Observability]
metrics-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }

# [Reactor]
reactor-core = { module = "io.projectreactor:reactor-core", version.ref = "reactor" }
reactor-test = { module = "io.projectreactor:reactor-test", version.ref = "reactor" }

# [Springdoc OpenAPI]
boot-springdoc-webflux = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }
projectlombok  = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }

# [Observability]
actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }

# ---- Test ----
boot-test         = { module = "org.springframework.boot:spring-boot-starter-test" }
platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# [Json -> Xml]
jsonXml         = { module ="org.json:json", version.ref = "jsonXml"}

# [OpenFeign]
spring-cloud-starter-openfeign = { module = "org.springframework.cloud:spring-cloud-starter-openfeign" }

# [Jackson]
jackson-databind    = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "core" }
jackson-core        = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "core" }

# [R2DBC]
boot-starter-data-r2dbc = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc" }
r2dbc-sqlserver = { module = "io.r2dbc:r2dbc-mssql", version.ref = "r2dbc-sqlserver" }
r2dbc-pool = { module = "io.r2dbc:r2dbc-pool" }

# [FICOHSA]
ficohsa-router = { module = "com.ficohsa.lib:router", version.ref = "ficohsa-lib" }
ficohsa-core = { module = "com.ficohsa.lib:core", version.ref = "ficohsa-lib" }
ficohsa-regionalization = { module = "com.ficohsa.lib:regionalization", version.ref = "ficohsa-regionalization" }
ficohsa-logging = { module = "com.ficohsa.lib:logging-spring-boot-starter", version.ref = "ficohsa-logging" }
ficohsa-web-client = { module = "com.ficohsa.lib:web-client", version.ref = "ficohsa-lib" }

# [Resilience4j]
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry", version.ref = "resilience4j" }
resilience4j-spring-boot3 = { module = "io.github.resilience4j:resilience4j-spring-boot3", version.ref = "resilience4j" }
